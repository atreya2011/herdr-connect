[package]
name = "herdr-connect-rs"
version = "0.1.0"
edition = "2024"
description = "Rust Discord bridge for Herdr agents"
license = "MIT"
repository = "https://github.com/atreya2011/herdr-connect"
readme = "README.md"
keywords = ["herdr", "discord"]
categories = ["command-line-utilities"]

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Twilight and Rustls bring unavoidable duplicate transitive versions.
multiple-crate-versions = { level = "allow", priority = 1 }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
ctor = "0.4.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "io-util", "io-std", "sync"] }
twilight-http = "0.17.1"
twilight-model = "0.17.1"
twilight-gateway = { version = "0.17.1", default-features = false, features = ["rustls-platform-verifier"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
notify = "=8.2.0"

[dev-dependencies]
serial_test = "3.2.0"
